org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 full mode — more aggressive shrinking and obfuscation for release.
# Default since AGP 8.0 but kept explicit so a future flip can't silently
# regress release APK size.
android.enableR8.fullMode=true

# Strip resources not referenced from any kept code path. Pairs with
# isShrinkResources = true in the release buildType.
android.enableResourceOptimizations=true

kotlin.code.style=official
