org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 full mode — more aggressive shrinking and obfuscation for release.
# Default since AGP 8.0 but kept explicit so a future flip can't silently
# regress release APK size.
android.enableR8.fullMode=true

# Strip resources not referenced from any kept code path. Pairs with
# isShrinkResources = true in the release buildType.
android.enableResourceOptimizations=true

kotlin.code.style=official

# ── React Native (the /mobile app, built in this single root Gradle build) ──
# Only the RN gradle plugin reads these; the legacy :app build ignores them.
# arm64-only to match :app and the llama.cpp JNI (strips x86/armv7 RN binaries).
reactNativeArchitectures=arm64-v8a
# New Architecture (TurboModules + Fabric) + Hermes — locked decisions.
newArchEnabled=true
hermesEnabled=true
# RN's java-version-alignment does rootProject.allprojects { jvmToolchain(17) },
# which collides with our already-finalized JVM-21 :app/:core:* ("languageVersion
# is final"). Disable it globally; build.gradle.kts then re-aligns ONLY the RN app
# + its node_modules libraries to a consistent JDK 17 (else Kotlin 21 vs Java 8).
react.internal.disableJavaVersionAlignment=true
