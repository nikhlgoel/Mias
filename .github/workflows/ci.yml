name: CI Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Setup Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # Adjust to your current project target JVM version

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run Compilation and Verification Tests
      run: ./gradlew build