# .github/workflows/ci.yml
name: CI Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Fixes the 'Permission Denied' boot failure caused by pushing from Windows
      - name: Ensure Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Appends standard flags to bypass local environment daemon/cache friction
      - name: Run Compilation and Verification Tests
        run: ./gradlew build --no-daemon --stacktrace
