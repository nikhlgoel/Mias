/*
 * Mias React Native app (Android) — built inside the single root Gradle build
 * (see /settings.gradle.kts). The legacy Kotlin :app stays installable until the
 * RN cutover (strangler-fig). JS/TS lives at /mobile; package.json is two dirs up.
 */
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Hilt DI + KSP — the native modules obtain :core singletons (orchestrator,
// repositories) through Hilt EntryPoints on the Application.
apply plugin: "com.google.devtools.ksp"
apply plugin: "com.google.dagger.hilt.android"

import java.util.Properties

// Reuse the repo's single sources of truth for signing + version.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = ((versionProps['VERSION_CODE'] ?: '1') as String).toInteger()
def appVersionName = (versionProps['VERSION_NAME'] ?: '1.0.0') as String

react {
    // MUST be explicit in the single-root build: the plugin's default `root` is
    // rootProject.dir("../") (= repo-root's parent here), not this module's ../../.
    // Pin everything at /mobile where package.json + node_modules live.
    root = file("$rootDir/mobile")
    reactNativeDir = file("$rootDir/mobile/node_modules/react-native")
    codegenDir = file("$rootDir/mobile/node_modules/@react-native/codegen")
    cliFile = file("$rootDir/mobile/node_modules/react-native/cli.js")
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    // Pinned explicitly (the template's rootProject.ext is gone in the root build).
    // NDK 27.0.12077973 is the AGP 8.12 default already installed + used by the
    // llama.cpp JNI build, so no extra NDK download.
    ndkVersion "27.0.12077973"
    buildToolsVersion "36.0.0"
    compileSdk 36

    namespace "dev.mias.mobile"
    defaultConfig {
        applicationId "io.mias.app"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode appVersionCode
        versionName appVersionName

        // arm64-only — matches :app and the llama.cpp JNI; strips RN's
        // x86/x86_64/armeabi-v7a binaries (and honours reactNativeArchitectures).
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // 16 KB page-size compliance: uncompressed JNI libs so the loader honours the
    // alignment RN's prebuilt libs (and our CMake flag) set. Mirrors :app.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // S7 cutover: the RN app is now THE app — installs as io.mias.app
            // (the .rn side-by-side suffix is gone with the legacy Compose app).
        }
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // JVM target 21 — matches :core:* so this module depends on the core
    // libraries directly. Set explicitly (not just via /build.gradle.kts) so the
    // Java + Kotlin targets stay consistent regardless of RN plugin ordering.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    // RN version is set by the React Native Gradle Plugin.
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Cold-start biometric gate. Versions from the shared catalog.
    implementation libs.biometric
    implementation libs.appcompat

    // Wrapped core libraries (S2: inference; S3: data/prefs/security; S4:
    // model-hub/speech/thermal). The native modules expose these to TS behind
    // typed event/method surfaces.
    implementation project(':core:common')
    implementation project(':core:inference')
    implementation project(':core:data')
    implementation project(':core:security')
    implementation project(':core:model-hub')
    implementation project(':core:speech')
    implementation project(':core:thermal')
    implementation project(':core:evolution')
    // Agent capabilities (multibound) — registered into the ReAct tool registry
    // at startup by ToolBootstrapper (S7 cutover).
    implementation project(':core:agent')

    // Hilt — EntryPoint access to the :core singleton graph + app injection.
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.kotlinx.coroutines.android

    // WorkManager + Hilt-Work — background self-learning (EvolutionWorker).
    implementation libs.work.runtime.ktx
    implementation libs.hilt.work
    ksp libs.hilt.work.compiler

    // Ktor HttpClient — the shared client (web/HF lookups) provided into the Hilt
    // graph by NetworkModule (relocated from the deleted core:network at S7).
    implementation libs.ktor.client.core
    implementation libs.ktor.client.cio
    implementation libs.ktor.client.content.negotiation
    implementation libs.ktor.serialization.kotlinx.json
    implementation libs.kotlinx.serialization.json
}
